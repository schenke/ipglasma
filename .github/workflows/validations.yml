name: Validation smoke test

# Runs two validation setups end to end (without JIMWLK) in their quick
# modes, which the unit tests (tests.yml) do not: lattice_symmetries (64^2,
# the index bookkeeping from the light cone to the observables, a few
# seconds) and dilute_limit (64^2, the light-cone matching, the evolution
# and T^munu at second order in g^2 mu, about 15 s with 2 workers).
# Neither needs the nuclear configurations of download_nucleusTables.sh.
# Each script exits with 1 if one of its checks fails.
#
# The FFT plans are fixed (IPGLASMA_DETERMINISTIC_FFT), so that the
# bit-level checks of lattice_symmetries do not depend on FFTW's timing.
# Its observables (dN/dy, eps_n) may differ by several percent between
# the original and the transformed event, since the light-cone matching
# condition can have several solutions in strong-field cells (#107); a
# bookkeeping error would change about half of all points, which
# --max-differing (25%) catches. The CI therefore allows 15% in the
# observables (3% by default), so that a change of the example input or
# of the random numbers, which draws another event, does not fail the job.

on:
  push:
    branches: [devel, main]
  pull_request:
    branches: [devel, main]

jobs:
  validations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libgsl-dev python3-numpy python3-scipy python3-matplotlib

      - name: Build and install ipglasma
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DdisableMPI=ON -DIPGLASMA_DETERMINISTIC_FFT=ON
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Lattice symmetries (quick)
        working-directory: validations/lattice_symmetries
        run: python3 lattice_symmetries.py --ipglasma-path ../.. --quick --observable-tolerance 0.15

      - name: Dilute limit (quick)
        working-directory: validations/dilute_limit
        run: python3 dilute_limit.py --ipglasma-path ../.. --quick --max-workers 2

      - name: Keep the outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-outputs
          path: |
            validations/lattice_symmetries/symmetries_output/
            validations/dilute_limit/dilute_output/
          if-no-files-found: ignore
